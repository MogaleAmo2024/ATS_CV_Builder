<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ATS Pro | AI Resume & Cover Letter Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --email-color: #8b5cf6;
      --wa-color: #25D366;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
    }

    nav {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; }
    .logo span { color: var(--primary); }

    .container {
      max-width: 1300px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      gap: 30px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .column {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .input-col { flex: 1; min-width: 350px; }
    .preview-col { flex: 1.2; min-width: 450px; }

    h2 { font-weight: 600; font-size: 1.2rem; margin-top: 0; display: flex; align-items: center; gap: 10px; }
    .step-num { background: var(--primary); color: white; width: 28px; height: 28px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 0.9rem; }

    textarea, input[type="text"], input[type="email"] {
      width: 100%;
      padding: 15px;
      margin-bottom: 25px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea { height: 160px; resize: vertical; }
    textarea:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

    .upload-zone {
      border: 2px dashed var(--border);
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 25px;
      background: rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-zone:hover { border-color: var(--primary); background: rgba(59, 130, 246, 0.05); }
    .upload-zone p { margin: 0; font-weight: 600; }
    .upload-zone span { font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 5px; }

    button {
      padding: 14px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; }

    .btn-download { background: #10b981; margin-bottom: 20px; }
    .btn-download:hover:not(:disabled) { background: #059669; }

    .send-options { display: flex; gap: 10px; margin-bottom: 15px; }
    .send-options input { flex: 1; margin-bottom: 0; padding: 12px; font-size: 0.9rem; }
    .send-options button { width: auto; padding: 12px 20px; font-size: 0.9rem; }
    .btn-email { background: var(--email-color); }
    .btn-email:hover:not(:disabled) { background: #7c3aed; }
    .btn-wa { background: var(--wa-color); color: #000; }
    .btn-wa:hover:not(:disabled) { background: #1da851; }

    .status { margin-top: 15px; text-align: center; font-size: 0.9rem; color: var(--text-muted); min-height: 20px; }
    #send-status { font-weight: 600; text-align: center; margin-top: 15px; font-size: 0.9rem; }

    /* Preview Areas */
    #cv-preview, #letter-preview {
      background: white;
      color: #000;
      padding: 40px;
      border-radius: 8px;
      min-height: 600px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .empty-state { color: #94a3b8; text-align: center; margin-top: 200px; font-size: 1.1rem; }

    /* Document Styling (applies to both CV and Letter) */
    #cv-preview h1, #letter-preview h1 { text-align: center; font-size: 22pt; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
    #cv-preview h2, #letter-preview h2 { font-size: 12pt; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; color: #333; }
    #cv-preview ul, #letter-preview ul { padding-left: 20px; margin-top: 5px; }
    #cv-preview li, #letter-preview li { margin-bottom: 6px; line-height: 1.4; font-size: 11pt; }
    #cv-preview p, #letter-preview p { line-height: 1.6; margin-bottom: 15px; font-size: 11pt; }

    /* Tabs */
    .tab-container {
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.2);
      padding: 5px;
      border-radius: 8px;
    }
    .tab-btn {
      width: auto;
      padding: 8px 16px;
      background: transparent;
      font-size: 0.9rem;
      border-radius: 6px;
    }
    .tab-btn.active { background: var(--primary); }

    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <div class="logo">ATS <span>Pro</span></div>
    <div style="font-size: 0.9rem; color: var(--text-muted);">AI-Powered Resume & Cover Letter Optimization</div>
  </nav>

  <div class="container">
    <!-- Left Column: Inputs -->
    <div class="column input-col">
      <h2><span class="step-num">1</span> Upload or Paste Resume</h2>
      <div class="upload-zone" onclick="document.getElementById('cv_file').click()">
        <p>Click to upload your CV</p>
        <span>Supported: PDF, DOCX, TXT</span>
        <input type="file" id="cv_file" accept=".pdf,.docx,.txt" style="display:none;" onchange="uploadCV()">
      </div>
      <p id="upload-status" style="color: #10b981; font-size: 0.85rem; margin-top: -15px; margin-bottom: 15px; font-weight: 600;"></p>

      <textarea id="experience" placeholder="Your extracted experience will appear here, or you can type it manually..."></textarea>

      <h2><span class="step-num">2</span> Target Job Title</h2>
      <input type="text" id="job_title" placeholder="e.g., Software Engineer">

      <h2><span class="step-num">3</span> Paste Job Description</h2>
      <textarea id="job_description" placeholder="Paste the full job posting you are applying for..."></textarea>

      <button id="generateBtn" onclick="generateCV()">
        <span id="btn-text">Optimize CV & Letter</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
      <p id="status" class="status"></p>
    </div>

    <!-- Right Column: Output -->
    <div class="column preview-col">
      
      <!-- Header with Tabs -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <h2 style="margin: 0;">Optimized Result</h2>
        
        <div class="tab-container">
          <button id="tab-cv" class="tab-btn active" onclick="switchTab('cv')">CV</button>
          <button id="tab-letter" class="tab-btn" onclick="switchTab('letter')">Motivational Letter</button>
        </div>
      </div>

      <!-- Action Buttons -->
      <button id="downloadBtn" class="btn-download" style="display:none;" onclick="downloadPDF()">⬇️ Download as PDF</button>
      
      <div id="send-options-container" style="display:none;">
        <div class="send-options">
          <input type="email" id="email_input" placeholder="recipient@email.com">
          <button class="btn-email" onclick="sendEmail()">✉️ Send Email</button>
        </div>
        <div class="send-options">
          <input type="text" id="phone_input" placeholder="27123456789 (no + or spaces)">
          <button class="btn-wa" onclick="sendWhatsApp()">💬 Send WhatsApp</button>
        </div>
        <p id="send-status"></p>
      </div>
      
      <!-- Preview Areas -->
      <div id="cv-preview">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <br>Your ATS-optimized CV will appear here.
        </div>
      </div>

      <div id="letter-preview" style="display: none;">
        <div class="empty-state">
          Your Motivational Letter will appear here.
        </div>
      </div>
      
    </div>
  </div>

  <!-- Link to the external JavaScript file -->
  <script src="/static/script.js"></script>
</body>
</html>
